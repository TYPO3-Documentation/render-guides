# On a Dependabot bump under packages/typo3-docs-theme/, rebuild the committed
# assets, commit them to the Dependabot branch if they changed, and enable
# auto-merge for a patch or minor bump. check-built-assets.yaml is the actual
# gate; this only saves the manual rebuild.
#
# pull_request_target runs with the base repository's secrets, so:
#   - only Dependabot's own pushes trigger a build, of the exact head SHA
#   - the build refuses a PR that changes more than package(-lock).json
#   - npm ci --ignore-scripts
#   - the build job holds no secret; the jobs holding the App token never run
#     repository code. One job would not do: a build step can prepend to
#     $GITHUB_PATH and intercept the gh a later step calls with the token.
#
# The commit goes through the API (createCommitOnBranch), so it is Verified,
# and being made with the App token, it re-triggers the checks.

name: "Rebuild assets for Dependabot"

on: # yamllint disable-line rule:truthy
  pull_request_target:
    paths:
      - "packages/typo3-docs-theme/package.json"
      - "packages/typo3-docs-theme/package-lock.json"

permissions: {}

jobs:
  build:
    name: "build"
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      head_oid: ${{ steps.prepare.outputs.head_oid }}
      has_changes: ${{ steps.prepare.outputs.has_changes }}

    steps:
      - name: "Checkout Dependabot branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
          fetch-depth: 0

      - name: "Verify PR diff is lockfile-only"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Anything else means the branch was tampered with: fail before
          # running the vite/grunt config.
          ALLOWED=(
            packages/typo3-docs-theme/package.json
            packages/typo3-docs-theme/package-lock.json
          )

          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          unexpected=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            match=0
            for a in "${ALLOWED[@]}"; do
              [ "$f" = "$a" ] && match=1 && break
            done
            [ $match -eq 0 ] && unexpected="${unexpected}${f}"$'\n'
          done <<< "$changed"

          if [ -n "$unexpected" ]; then
            echo "::error::Dependabot PR touches files outside the npm lockfile set. Refusing to build."
            printf '%s' "$unexpected"
            exit 1
          fi

      # .nvmrc, as in main.yaml: the output is byte-compared, so the Node
      # version must be the one contributors use.
      - name: "Install Node"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: "packages/typo3-docs-theme/.nvmrc"
          cache: "npm"
          cache-dependency-path: "packages/typo3-docs-theme/package-lock.json"

      - name: "Install npm dependencies (no install scripts)"
        working-directory: packages/typo3-docs-theme
        run: "npm ci --ignore-scripts"

      - name: "Build assets"
        working-directory: packages/typo3-docs-theme
        run: "npm run build"

      # New files are committed too (a hashed vite chunk arrives untracked);
      # a change outside the asset trees fails the job.
      - name: "Prepare commit inputs"
        id: prepare
        run: |
          ASSET_PATHS=(
            packages/typo3-docs-theme/assets
            packages/typo3-docs-theme/resources/public
          )

          outside="$(git status --porcelain -z -- . \
            ':(exclude)packages/typo3-docs-theme/assets' \
            ':(exclude)packages/typo3-docs-theme/resources/public' | tr '\0' '\n')"
          if [ -n "$outside" ]; then
            echo "::error::Build touched files outside the asset trees. Refusing to commit."
            printf '%s\n' "$outside"
            exit 1
          fi

          mkdir -p asset-commit-inputs
          # NUL-delimited, so no filename can skew the parsing.
          {
            git diff -z --name-only --no-renames --diff-filter=d -- "${ASSET_PATHS[@]}"
            git ls-files -z --others --exclude-standard -- "${ASSET_PATHS[@]}"
          } > asset-commit-inputs/upserts
          git diff -z --name-only --no-renames --diff-filter=D -- "${ASSET_PATHS[@]}" > asset-commit-inputs/deletes

          if [ -s asset-commit-inputs/upserts ] || [ -s asset-commit-inputs/deletes ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "head_oid=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The only thing that reaches the job holding the token, read as data.
      - name: "Upload rebuilt assets"
        if: steps.prepare.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "rebuilt-assets"
          path: |
            packages/typo3-docs-theme/assets
            packages/typo3-docs-theme/resources/public
            asset-commit-inputs
          retention-days: 1
          if-no-files-found: "error"

  commit:
    name: "commit"
    needs: build
    if: needs.build.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # No checkout, no npm: the App token never meets repository code.
    permissions: {}

    steps:
      - name: "Download rebuilt assets"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "rebuilt-assets"

      - name: "Mint App token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # expectedHeadOid is the SHA that was built: a force-push in between
      # fails the commit instead of being overwritten.
      - name: "Commit rebuilt assets as a verified commit"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_HEAD_OID: ${{ needs.build.outputs.head_oid }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const readPaths = (name) =>
              fs.readFileSync(`asset-commit-inputs/${name}`)
                .toString('utf8')
                .split('\0')
                .filter(Boolean);

            const upserts = readPaths('upserts');   // modified or newly created
            const deletes = readPaths('deletes');

            if (upserts.length === 0 && deletes.length === 0) {
              core.info('No generated asset changes.');
              return;
            }

            const fileChanges = {
              additions: upserts.map((path) => ({
                path,
                contents: fs.readFileSync(path).toString('base64'),
              })),
            };
            if (deletes.length) {
              fileChanges.deletions = deletes.map((path) => ({ path }));
            }

            const result = await github.graphql(
              `mutation($input: CreateCommitOnBranchInput!) {
                 createCommitOnBranch(input: $input) { commit { oid url } }
               }`,
              {
                input: {
                  branch: {
                    repositoryNameWithOwner: context.payload.repository.full_name,
                    branchName: context.payload.pull_request.head.ref,
                  },
                  expectedHeadOid: process.env.EXPECTED_HEAD_OID,
                  message: { headline: '[TASK] Rebuild theme assets after dependency update' },
                  fileChanges,
                },
              }
            );

            const commit = result.createCommitOnBranch.commit;
            core.info(`Created verified rebuild commit ${commit.oid}`);
            core.info(commit.url);

  # Its own job, so a bump that changes no assets -- and skips the commit job
  # -- is auto-merged too. A failed build or commit keeps it from running.
  auto-merge:
    name: "auto-merge"
    needs: [build, commit]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.commit.result == 'success' || needs.commit.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: "Dependabot metadata"
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Mint App token"
        id: app-token
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # No merge method: the merge queue rule on "main" sets it.
      - name: "Enable auto-merge for patch/minor updates"
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh pr merge --auto "$PR_NUMBER" -R "$REPOSITORY"
