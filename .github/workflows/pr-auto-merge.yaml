# https://docs.github.com/en/github-ae@latest/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
name: Auto-merge

on:
  # We're using pull_request_target instead of pull_request due to permission issues with the pull_request target:
  # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#responding-to-events
  pull_request_target:

jobs:
  auto-merge:
    name: Dependabot auto-merge
    permissions:
      contents: write

    runs-on: ubuntu-latest

    if: ${{ github.actor == 'dependabot[bot]' }}

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # An App token, not GITHUB_TOKEN: a merge group enqueued with
      # GITHUB_TOKEN never runs "Main", so its required checks time out.
      - name: Mint App token
        id: app-token
        if: |
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          !contains(steps.metadata.outputs.directory, 'typo3-docs-theme')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Theme PRs are left to dependabot-rebuild-assets.yaml, which enables
      # auto-merge after the rebuild: "check-built-assets" is not a required
      # check, so the queue would otherwise merge the stale assets. Once it is
      # required, this exclusion and the notice below can go.
      #
      # No merge method: the merge queue rule on "main" sets it.
      - name: Enable auto-merge
        if: |
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          !contains(steps.metadata.outputs.directory, 'typo3-docs-theme')
        run: gh pr merge -R "$REPOSITORY" --auto "$PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Note skipped auto-merge for theme PRs
        if: contains(steps.metadata.outputs.directory, 'typo3-docs-theme')
        run: |
          echo "::notice::Auto-merge is not enabled here for theme PRs. The dependabot-rebuild-assets workflow rebuilds the assets, commits them to this branch if they changed and enables auto-merge itself for a patch or minor bump; a failed build leaves the pull request open for manual review."
