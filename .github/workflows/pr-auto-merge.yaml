# https://docs.github.com/en/github-ae@latest/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
name: Auto-merge

on:
  # We're using pull_request_target instead of pull_request due to permission issues with the pull_request target:
  # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#responding-to-events
  pull_request_target:

jobs:
  auto-merge:
    name: Dependabot auto-merge
    permissions:
      contents: write

    runs-on: ubuntu-latest

    if: ${{ github.actor == 'dependabot[bot]' }}

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # "main" is gated by a merge queue, so enabling auto-merge does not merge
      # the pull request — it enqueues it, and the merge group must first report
      # the required status checks of the "Main" workflow (merge_group trigger).
      #
      # Events created with the GITHUB_TOKEN never trigger a workflow run, so
      # enqueuing with it produces a merge group that "Main" never runs on: the
      # required checks stay pending until the queue's check_response_timeout
      # elapses and the entry is dropped again. The App token is not subject to
      # that restriction.
      - name: Mint App token
        id: app-token
        if: |
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          !contains(steps.metadata.outputs.directory, 'typo3-docs-theme')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Theme-package PRs are intentionally excluded from auto-merge.
      # The dependabot-rebuild-assets workflow needs to rebuild and push
      # regenerated assets to the PR branch before the PR can merge; if
      # auto-merge fires here at PR-open time it merges BEFORE the
      # rebuild commit lands, leaving stale assets on main. Theme PRs
      # require a manual review/merge once the rebuild commit shows up.
      #
      # No merge method is passed: it is set by the merge queue rule on "main",
      # and gh warns that any --squash/--merge/--rebase given here is ignored.
      - name: Enable auto-merge
        if: |
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          !contains(steps.metadata.outputs.directory, 'typo3-docs-theme')
        run: gh pr merge -R "$REPOSITORY" --auto "$PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Note skipped auto-merge for theme PRs
        if: contains(steps.metadata.outputs.directory, 'typo3-docs-theme')
        run: |
          echo "::notice::Auto-merge intentionally skipped for theme PRs. The dependabot-rebuild-assets workflow rebuilds and pushes regenerated assets to this branch; merge manually once that commit lands and all checks are green."
